<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="1.75"
  stroke-linecap="round"
  stroke-linejoin="round"
  class="janus-i-markdown"
  aria-hidden="true"
>
  <style>
      .janus-i-markdown .m { transform-box: fill-box; transform-origin: center; }
      @keyframes janus-md-pulse {
      0%, 100% { stroke-width: 1.75; opacity: 1; }
      50% { stroke-width: 2.35; opacity: 0.75; }
      }
      @keyframes janus-md-arrow {
      0%, 100% { transform: translate(0, 0); }
      40% { transform: translate(1.5px, 2.5px); }
      55% { transform: translate(1.5px, 2.5px); }
      }
      @keyframes janus-md-m {
      0%, 100% { transform: translateY(0); }
      40% { transform: translateY(-1.25px); }
      55% { transform: translateY(-1.25px); }
      }
      .janus-i-markdown .frame {
      animation: janus-md-pulse 0.85s ease-in-out infinite;
      }
      .janus-i-markdown .letter {
      animation: janus-md-m 0.85s ease-in-out infinite;
      }
      .janus-i-markdown .arrow {
      animation: janus-md-arrow 0.85s ease-in-out infinite;
      }

  </style>
  <rect
    class="frame"
    x="3"
    y="5"
    width="18"
    height="14"
    rx="2"
  />
  <path
    class="m letter"
    d="M7 15V9l2.5 3.5L12 9v6"
  />
  <path
    class="m arrow"
    d="M15 11v4l3-3"
  />
</svg>
